# Render Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec

services:
  # Option 1: Python Web Service (Runs server.py with custom Byte-Range video streaming & SPA fallback)
  - type: web
    name: study-and-work-australia
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PORT
        value: 10000

  # Option 2: Render Static Site (Alternative: If you want 100% free CDN hosting without spin-down sleep)
  # To use this instead, uncomment below and comment out the Python web service above:
  # - type: web
  #   name: study-and-work-australia-static
  #   runtime: static
  #   plan: free
  #   buildCommand: ""
  #   staticPublishPath: .
  #   routes:
  #     - type: rewrite
  #       source: /*
  #       destination: /index.html
